
name: Kamera Izleme APK derle

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Android APK oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Proje dosyalarını kontrol et
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -d public

      - name: Bağımlılıkları kur
        run: npm install

      - name: Web dosyalarını hazırla
        run: npm run copy-web

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Android dosyalarını eşitle
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: kamera-izleme-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
